<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dairy Digital Twin</title>
    <script>
      /* apply the saved light / dark theme before the first paint, so the page never flashes the wrong one */
      try { document.documentElement.dataset.theme = localStorage.getItem('ddt.theme.v1') === 'light' ? 'light' : 'dark' } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>

  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
